{% extends "base_login.html" %}

{% block content %}

<div class="register-box">
    <div class="register-logo">
      <a href="/" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        {% if custom_logo_url %}
          <img src="{{ custom_logo_url }}" alt="{{ custom_app_title|default:'BACKUP WEB' }}" style="max-height: 52px; max-width: 220px; object-fit: contain; margin-bottom: 2px;">
        {% endif %}
        <span><b>{{ custom_app_title|default:'BACKUP WEB' }}</b></span>
      </a>
    </div>
  
    <div class="card">
      <div class="card-body register-card-body">
        <p class="login-box-msg font-weight-bold text-muted mb-4">Iniciar Sesión en {{ custom_app_title|default:'BACKUP WEB' }}</p>
        <form action="/accounts/login/" method="post">
            {% csrf_token %}
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Usuario" name="username" required autofocus> 
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-user"></span>
                </div>
              </div>
            </div>
            
            <div class="input-group mb-3">
              <input type="password" class="form-control" placeholder="Contraseña" name="password" required> 
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>
            
            <div class="mt-4">
              <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </div>
          </form>
          
      </div>
      <!-- /.form-box -->
    </div><!-- /.card -->
  </div>
  <!-- /.register-box -->

<script>
  document.querySelector('input[name="username"]').addEventListener('input', function() {
    this.value = this.value.toLowerCase().replace(/\s/g, '');
  });
</script>

{% endblock %}
