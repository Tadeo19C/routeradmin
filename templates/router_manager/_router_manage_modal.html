<!-- Router Manage Modal (Enfocado en la Categoría activa) -->
<div class="modal fade" id="routerManageModal" tabindex="-1" role="dialog" aria-labelledby="routerManageModalLabel" aria-hidden="true" style="z-index: 2050;">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="text-center p-4">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Cargando formulario...</p>
            </div>
        </div>
    </div>
</div>

<script>
    function confirmDeleteRouter(uuid, name) {
        if (confirm('¿Estás seguro de que deseas eliminar el dispositivo "' + name + '"?')) {
            var confirmation = prompt('Por favor, escribe "borrar" para confirmar la eliminación:');
            if (confirmation && confirmation.trim().toLowerCase() === 'borrar') {
                window.location.href = '/router/manage/?uuid=' + uuid + '&action=delete&confirmation=borrar';
            } else if (confirmation !== null) {
                alert('Confirmación incorrecta. El dispositivo no ha sido eliminado.');
            }
        }
    }

    function getCurrentCategoryUuid(explicitCatUuid) {
        if (explicitCatUuid) return explicitCatUuid;
        const params = new URLSearchParams(window.location.search);
        if (params.get('category')) return params.get('category');
        const mainBtn = document.getElementById('add-router-btn');
        return mainBtn ? (mainBtn.getAttribute('data-category-uuid') || '') : '';
    }

    function openRouterModal(uuid, categoryUuid, preselectGroupId) {
        var catUuid = getCurrentCategoryUuid(categoryUuid);
        var params = ['ajax=1'];
        if (catUuid) params.push('category=' + encodeURIComponent(catUuid));
        if (uuid) {
            params.unshift('uuid=' + encodeURIComponent(uuid));
        } else if (preselectGroupId) {
            params.push('group_id=' + encodeURIComponent(preselectGroupId));
        }
        var url = '/router/manage/?' + params.join('&');

        $('#routerManageModal').appendTo("body");
        $('#routerManageModal .modal-content').html(
            '<div class="text-center p-4"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i><p class="mt-2 mb-0 small text-muted">Cargando formulario...</p></div>'
        );
        $('#routerManageModal').modal('show');

        $('#routerManageModal .modal-content').load(url, function() {
            const savedData = sessionStorage.getItem('pending_router_form');
            if (savedData && !uuid) {
                try {
                    const formData = JSON.parse(savedData);
                    formData.forEach(field => {
                        if (field.name === 'csrfmiddlewaretoken' || field.name === 'category_uuid') return;
                        const $el = $(`[name="${field.name}"]`);
                        if ($el.length) {
                            if ($el.is(':checkbox') || $el.is(':radio')) {
                                $(`[name="${field.name}"][value="${field.value}"]`).prop('checked', true).trigger('change');
                            } else {
                                $el.val(field.value).trigger('change');
                            }
                        }
                    });
                    sessionStorage.removeItem('pending_router_form');
                } catch (e) {
                    console.error("Restore failed", e);
                }
            }

            if (!uuid) {
                if (preselectGroupId && $('#id_router_group').length) {
                    $('#id_router_group').val(String(preselectGroupId)).trigger('change');
                }
                const urlParams = new URLSearchParams(window.location.search);
                const createdGroup = urlParams.get('created_group');
                if (createdGroup && $('#id_router_group').length) {
                    $('#id_router_group').val(createdGroup).trigger('change');
                }
            }
        });
    }

    if (!window.__routerModalCaptureBound) {
        window.__routerModalCaptureBound = true;

        document.addEventListener('click', function(e) {
            var addBtn = e.target.closest('#add-router-btn, .add-router-btn');
            if (addBtn) {
                e.preventDefault();
                e.stopPropagation();
                var catUuid = addBtn.getAttribute('data-category-uuid') || '';
                var groupId = addBtn.getAttribute('data-group-id') || null;
                openRouterModal(null, catUuid, groupId);
                return;
            }

            var editBtn = e.target.closest('.manage-router-btn');
            if (editBtn) {
                e.preventDefault();
                e.stopPropagation();
                var uuid = editBtn.getAttribute('data-uuid');
                var catUuid = editBtn.getAttribute('data-category-uuid') || '';
                openRouterModal(uuid, catUuid, null);
            }
        }, true);

        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'resume_create') {
                const catParam = urlParams.get('category') || '';
                openRouterModal(null, catParam, null);
                setTimeout(function() {
                    const cleanUrl = window.location.pathname + (catParam ? ('?category=' + encodeURIComponent(catParam)) : '');
                    window.history.replaceState({}, '', cleanUrl);
                }, 800);
            }
        });
    }
</script>
