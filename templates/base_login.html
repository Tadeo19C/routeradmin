<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEGACOM | Acceso</title>

  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="/static/AdminLTE-3.2.0/plugins/fontawesome-free/css/all.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="/static/AdminLTE-3.2.0/dist/css/adminlte.min.css">
  <!-- Modern UI -->
  <link rel="stylesheet" href="/static/modern_ui.css">
  <style>
    body {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif !important;
        margin: 0;
        padding: 20px;
    }
    .register-box, .login-box {
        background: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        width: 100%;
        max-width: 420px;
        position: relative;
        overflow: hidden;
    }
    .register-box::before, .login-box::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #2563eb, #38bdf8);
    }
    .register-box .card, .login-box .card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        margin-bottom: 0;
    }
    .register-card-body, .login-card-body {
        background: transparent !important;
        color: #0f172a !important;
        padding: 0 !important;
    }
    .register-logo, .login-logo {
        margin-bottom: 1.5rem;
        text-align: center;
    }
    .register-logo a, .login-logo a {
        color: #0f172a !important;
        font-weight: 800;
        letter-spacing: -0.5px;
        font-size: 2.2rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .register-logo a::before, .login-logo a::before {
        content: "\f233";
        font-family: "Font Awesome 5 Free";
        font-weight: 900;
        font-size: 1.8rem;
        color: #2563eb;
    }
    .login-box-msg {
        font-size: 0.95rem;
        color: #64748b;
        text-align: center;
    }
    .form-control {
        background: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-right: none !important;
        color: #0f172a !important;
        border-top-left-radius: 10px !important;
        border-bottom-left-radius: 10px !important;
        height: 46px !important;
        font-size: 0.95rem !important;
        transition: all 0.2s ease;
    }
    .form-control:focus {
        background: #ffffff !important;
        border-color: #2563eb !important;
        box-shadow: none !important;
    }
    .form-control::placeholder {
        color: #94a3b8 !important;
    }
    .input-group-text {
        background: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-left: none !important;
        color: #64748b !important;
        border-top-right-radius: 10px !important;
        border-bottom-right-radius: 10px !important;
        padding: 0 16px;
    }
    .btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
        border: none !important;
        color: white !important;
        border-radius: 10px !important;
        height: 46px !important;
        font-weight: 700 !important;
        font-size: 1rem !important;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3) !important;
    }
    .btn-primary:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%) !important;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4) !important;
    }
  </style>
</head>
<body class="hold-transition">
{% block content %}
{% endblock %}

<!-- jQuery -->
<script src="/static/AdminLTE-3.2.0/plugins/jquery/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="/static/AdminLTE-3.2.0/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="/static/AdminLTE-3.2.0/dist/js/adminlte.min.js"></script>
{% include "template_messages.html" %}
</body>
</html>
