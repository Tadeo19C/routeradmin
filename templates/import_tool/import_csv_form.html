{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block page_custom_head %}
<style>
    /* Hacer que el campo de archivo y botón Browse sea compacto y no ocupe todo el ancho */
    #div_id_csv_file {
        max-width: 360px !important;
    }
    #div_id_csv_file .custom-file {
        max-width: 360px !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-8 col-lg-9">
        <div class="card card-primary card-outline shadow-sm">
            <div class="card-header bg-transparent border-bottom">
                <h3 class="card-title font-weight-bold text-primary">
                    <i class="fas fa-file-excel mr-2 text-success"></i> Importar desde Excel
                </h3>
            </div>
            <div class="card-body">
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_page_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.querySelector('#div_id_csv_file input[type="file"]');
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            const label = document.querySelector('#div_id_csv_file .custom-file-label');
            if (label && e.target.files && e.target.files.length > 0) {
                label.textContent = e.target.files[0].name;
            }
        });
    }
});
</script>
{% endblock %}
