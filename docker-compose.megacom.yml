services:
  megacom-db:
    container_name: megacom-db
    restart: unless-stopped
    image: postgres:16-bookworm
    security_opt:
      - seccomp:unconfined
    volumes:
      - megacom_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-megacom}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-megacom}"]
      interval: 5s
      timeout: 5s
      retries: 15

  megacom-app:
    container_name: megacom-app
    restart: unless-stopped
    build: .
    security_opt:
      - seccomp:unconfined
    environment:
      - SERVER_ADDRESS=${SERVER_ADDRESS:-0.0.0.0}
      - DEBUG_MODE=False
      - DATABASE_ENGINE=postgres
      - COMPOSE_VERSION=08a
      - COMPOSE_TYPE=with-postgres
      - POSTGRES_HOST=megacom-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-megacom}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - TZ=${TIMEZONE:-America/Managua}
      - DISABLE_EMBEDDED_SCHEDULER=1
    volumes:
      - megacom_media:/var/lib/routerfleet/
      - megacom_static:/app_static_files/
      - megacom_secrets:/app_secrets/
    command: /bin/bash /app/init.sh
    depends_on:
      - megacom-db

  megacom-scheduler:
    container_name: megacom-scheduler
    restart: unless-stopped
    build: .
    security_opt:
      - seccomp:unconfined
    command: python manage.py run_scheduler --interval 45
    environment:
      - SERVER_ADDRESS=${SERVER_ADDRESS:-0.0.0.0}
      - DEBUG_MODE=False
      - DATABASE_ENGINE=postgres
      - COMPOSE_VERSION=08a
      - COMPOSE_TYPE=with-postgres
      - POSTGRES_HOST=megacom-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-megacom}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - TZ=${TIMEZONE:-America/Managua}
    volumes:
      - megacom_media:/var/lib/routerfleet/
      - megacom_secrets:/app_secrets/
    depends_on:
      - megacom-db
      - megacom-app

  megacom-web:
    container_name: megacom-web
    restart: unless-stopped
    image: nginx:1.24-alpine
    security_opt:
      - seccomp:unconfined
    volumes:
      - megacom_static:/static:ro
    ports:
      - "${WEB_PORT_PRIMARY:-80}:80"
      - "${WEB_PORT_SECONDARY:-81}:81"
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            listen 81;
            client_max_body_size 50M;
            resolver 127.0.0.11 valid=10s ipv6=off;

            location /static/ {
                alias /static/;
            }

            location / {
                set $$upstream_app http://megacom-app:8001;
                proxy_pass $$upstream_app;
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
            }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - megacom-app

volumes:
  megacom_postgres_data:
  megacom_media:
  megacom_static:
  megacom_secrets:
